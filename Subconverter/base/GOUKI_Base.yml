mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
external-controller: 0.0.0.0:9090
hosts:
  mtalk.google.com: 108.177.125.188
dns:
  enable: true
  listen: 0.0.0.0:1053
  use-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    '+.lan': '192.168.1.1'
    '+.local': '192.168.1.1'
  fallback:
    - tls://1.1.1.1
    - tls://8.8.4.4
    - https://dns.google/dns-query
    - https://dns.cloudflare.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
    domain:
      - +.google.com
      - +.facebook.com
      - +.youtube.com
  fake-ip-filter:
    - +.lan
    - +.local
    - 'time.android.com'
    - 'time.google.com'
    - '*.pool.ntp.org'
    - 'time.windows.com'
    - 'time.apple.com'
    - +.market.xiaomi.com
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver-policy:
    '+.quandao.com':
      - https://doh.dohcore.com:2096/dns-query/DOGCLOUD_DOH_TOKEN#skip-cert-verify=true
      - https://doh.cloudflare-lab.com:2096/dns-query/DOGCLOUD_DOH_TOKEN#skip-cert-verify=true
    '+.jiandaoyun.com':
      - https://doh.dohcore.com:2096/dns-query/DOGCLOUD_DOH_TOKEN#skip-cert-verify=true
      - https://doh.cloudflare-lab.com:2096/dns-query/DOGCLOUD_DOH_TOKEN#skip-cert-verify=true
  ipv6: false
