[custom]
; 本配置需要插入 RunPod 节点时，请在转换请求中使用 insert=true。
; 其他配置或请求不设置 insert=true，默认不会插入该节点。
enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=base/GOUKI_Base.yml
exclude_remarks=(网址|导航|距离|重置|剩余|提示|请使用|到期|过期|测试|官网|勿用)

;Options for adding emojis
add_emoji=true
;remove_old_emoji=true
;emoji=!!import:snippets/emoji.toml

;Options for renaming nodes "NAME ONLY"
rename=!!import:snippets/rename_node.txt

;设置规则标志位
